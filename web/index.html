<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; overflow: hidden; }
  #t { position: absolute; inset: 2px 0 0 6px; }
</style>
</head>
<body>
<div id="t"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
// 화면과 입력만 맡는다. 메시지는 band를 거쳐 sill-host로 간다: r(크기) i(입력) / o(출력) x(세션 끝남) n(다시 시작). M1 설계 표 2.
const host = window.chrome.webview;
const term = new Terminal({
  fontFamily: '"Cascadia Mono", Consolas, monospace',
  fontSize: 13,
  cursorBlink: true,
  theme: { background: '#1e1e1e' },
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('t'));

const sendSize = () => host.postMessage('r' + term.cols + ',' + term.rows);
let ended = false;

term.onData(d => {
  if (ended) {
    ended = false;
    term.reset();
    host.postMessage('n');
    sendSize();
    return;
  }
  host.postMessage('i' + d);
});
term.onResize(sendSize);

host.addEventListener('message', e => {
  const m = e.data;
  if (m[0] === 'o') term.write(m.slice(1));
  else if (m === 'x' && !ended) {
    ended = true;
    term.write('\r\n\x1b[90m[세션이 끝났습니다. 아무 키나 누르면 다시 시작합니다]\x1b[0m\r\n');
  }
});

// Windows Terminal과 같게: Ctrl+C는 선택이 있으면 복사, 없으면 ^C. Ctrl+V는 브라우저 붙여넣기(xterm.js가 paste 이벤트를 처리).
term.attachCustomKeyEventHandler(e => {
  if (e.type !== 'keydown' || !e.ctrlKey || e.shiftKey || e.altKey) return true;
  if (e.code === 'KeyC' && term.hasSelection()) {
    navigator.clipboard.writeText(term.getSelection());
    term.clearSelection();
    return false;
  }
  return e.code !== 'KeyV';
});

new ResizeObserver(() => fit.fit()).observe(document.body);
fit.fit();
sendSize();
term.focus();
</script>
</body>
</html>
